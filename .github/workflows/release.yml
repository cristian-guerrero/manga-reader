name: Wails Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar Frontend (para embed)
        working-directory: ./frontend
        run: npm run build

      - name: Tests del Backend (Go)
        run: go test ./...

      - name: Tests del Frontend (Vitest)
        working-directory: ./frontend
        run: npm run test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: manga-visor2.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: manga-visor2
          - os: macos-latest
            platform: darwin/universal
            artifact_name: manga-visor2.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 libappstream-glib-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Determinar tag
        id: tag
        shell: bash
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
            echo "version=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          fi

      - name: Compilar App
        timeout-minutes: 30
        shell: bash
        run: |
          VERSION_LD="-X manga-visor/internal/version.Version=${{ steps.tag.outputs.version }}"
          
          echo "Iniciando compilación para plataforma: ${{ matrix.platform }}"
          echo "Versión: ${{ steps.tag.outputs.version }}"
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            chmod +x build-appimage.sh
            ./build-appimage.sh "${VERSION_LD} -s -w"
          else
            wails build -platform ${{ matrix.platform }} -ldflags="${VERSION_LD}"
          fi

      - name: Empaquetar macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd build/bin
          zip -r manga-visor2-macos.zip *.app
          rm -rf *.app

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar tag
        id: tag
        shell: bash
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          fi

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Generar checksums
        working-directory: ./dist
        run: sha256sum * > checksums.txt

      - name: Listar archivos
        run: ls -la dist/

      - name: Publicar Release
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --format="%s")
          TAG="${{ steps.tag.outputs.name }}"
          echo "Creando release: $TAG"
          
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$COMMIT_MSG"
          gh release upload "$TAG" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
