name: Wails Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: manga-visor2.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: manga-visor2
          - os: macos-latest
            platform: darwin/universal
            artifact_name: manga-visor2.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 libappstream-glib-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar App
        timeout-minutes: 30
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_LD="-X manga-visor/internal/version.Version=${{ github.ref_name }}"
          else
            VERSION_LD="-X manga-visor/internal/version.Version=latest"
          fi
          
          echo "Iniciando compilación para plataforma: ${{ matrix.platform }}"
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            chmod +x build-appimage.sh
            ./build-appimage.sh
          else
            wails build -platform ${{ matrix.platform }} -ldflags="${VERSION_LD}"
          fi

      - name: Empaquetar macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd build/bin
          zip -r manga-visor2-macos.zip *.app

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Determinar tag del release
        id: set-tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=latest" >> $GITHUB_OUTPUT
            echo "release_title=Latest Development Build" >> $GITHUB_OUTPUT
          fi

      - name: Eliminar release y tag latest anteriores (solo main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "Eliminando release 'latest' anterior..."
          gh release delete latest --yes || true
          echo "Eliminando tag 'latest' anterior..."
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Listar archivos
        run: ls -la dist/

      - name: Crear Release
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.set-tag.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.set-tag.outputs.release_title }}"
          
          echo "Creando release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "Build automático de la rama main" \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
