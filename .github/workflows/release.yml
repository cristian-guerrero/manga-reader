name: Wails Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Se activa al subir una etiqueta que empiece con 'v' (ej: v1.0.0)
#  pull_request:
#    branches:
#      - main

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: manga-visor2.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: manga-visor2
          - os: macos-latest
            platform: darwin/universal
            artifact_name: manga-visor2.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 libappstream-glib-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar App
        timeout-minutes: 30
        shell: bash
        run: |
          echo "Iniciando compilación para plataforma: ${{ matrix.platform }}"
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Build Linux AppImage using the script
            chmod +x build-appimage.sh
            ./build-appimage.sh
          else
            # Standard build for Windows/macOS
            wails build -platform ${{ matrix.platform }}
          fi
          
          echo "Compilación completada exitosamente"
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "Procesando archivo .app para macOS..."
            cd build/bin
            # En macOS el build genera una carpeta .app, comprimirla
            # El .zip es suficiente para distribución, los usuarios pueden descomprimirlo
            zip -r manga-visor2-macos.zip *.app
            echo "Archivo .zip creado correctamente"
          fi

      - name: Listar archivos en build/bin (debug)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "Contenido de build/bin:"
          ls -la build/bin/
          echo "Buscando .app:"
          find build/bin -maxdepth 1 -name "*.app" -type d

      - name: Crear Release en GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Determinar el nombre del release
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="${{ github.ref_name }}"
          else
            RELEASE_TAG="latest"
            RELEASE_TITLE="Latest Development Build"
          fi

          echo "Creando/Actualizando release para: $RELEASE_TAG"
          
          # Crear release si no existe (ignorar error si ya existe)
          gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "Build automático de la rama main" || true
          
          # Actualizar el release vía API para asegurar que no sea prerelease y sea latest
          # Esto es necesario porque el release podría haber sido creado anteriormente como prerelease
          JSON_PAYLOAD='{"prerelease": false, "make_latest": true}'
          echo "$JSON_PAYLOAD" | gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            --input -
          
          # Subir archivos según la plataforma
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Para macOS, solo subir el .zip (el .app está dentro)
            gh release upload "$RELEASE_TAG" build/bin/*.zip --clobber
          else
            # Para otras plataformas, subir todos los archivos
            gh release upload "$RELEASE_TAG" build/bin/* --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


