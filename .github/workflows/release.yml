name: Wails Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: manga-visor2.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: manga-visor2
          - os: macos-latest
            platform: darwin/universal
            artifact_name: manga-visor2.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 libappstream-glib-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar App
        timeout-minutes: 30
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_LD="-X manga-visor/internal/version.Version=${{ github.ref_name }}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION_LD="-X manga-visor/internal/version.Version=latest-${SHORT_SHA}"
          fi
          
          echo "Iniciando compilación para plataforma: ${{ matrix.platform }}"
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            chmod +x build-appimage.sh
            ./build-appimage.sh
          else
            wails build -platform ${{ matrix.platform }} -ldflags="${VERSION_LD}"
          fi

      - name: Empaquetar macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd build/bin
          zip -r manga-visor2-macos.zip *.app
          rm -rf *.app

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Generar checksums
        working-directory: ./dist
        run: sha256sum * > checksums.txt

      - name: Listar archivos
        run: ls -la dist/

      - name: Publicar Release
        shell: bash
        run: |
          git log -1 --format="%s" > /tmp/release-notes.txt

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Release versionado: crear SIN assets (1 paso, como llama.cpp)
            TAG="${{ github.ref_name }}"
            echo "Creando release: $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.txt
            gh release upload "$TAG" dist/* --clobber
          else
            # Nightly build — un solo release actualizado in-place
            echo "Actualizando nightly build..."

            if gh release view nightly >/dev/null 2>&1; then
              gh release upload nightly dist/* --clobber
              gh release edit nightly --title "Nightly Build" --notes-file /tmp/release-notes.txt
              git tag -f nightly
              git push -f origin nightly
            else
              # Crear SIN assets primero (1 paso, evita draft→publish)
              gh release create nightly \
                --title "Nightly Build" \
                --notes-file /tmp/release-notes.txt
              gh release upload nightly dist/* --clobber
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
