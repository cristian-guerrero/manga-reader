name: Wails Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Se activa al subir una etiqueta que empiece con 'v' (ej: v1.0.0)
#  pull_request:
#    branches:
#      - main

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.set-tag.outputs.release_tag }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Determinar tag del release
        id: set-tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Eliminar release y tag anteriores (para latest)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "Eliminando release 'latest' anterior si existe..."
          gh release delete latest --yes || true
          echo "Eliminando tag 'latest' anterior si existe..."
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear Release en GitHub
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.set-tag.outputs.release_tag }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TITLE="${{ github.ref_name }}"
          else
            RELEASE_TITLE="Latest Development Build"
          fi
          
          echo "Creando release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "Build automático de la rama main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: manga-visor2.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: manga-visor2
          - os: macos-latest
            platform: darwin/universal
            artifact_name: manga-visor2.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 libappstream-glib-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar App
        timeout-minutes: 30
        shell: bash
        run: |
          RELEASE_TAG="${{ needs.create-release.outputs.release_tag }}"
          VERSION_LD="-X manga-visor/internal/version.Version=${RELEASE_TAG}"
          echo "Iniciando compilación para plataforma: ${{ matrix.platform }} (versión: ${RELEASE_TAG})"
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Build Linux AppImage using the script
            chmod +x build-appimage.sh
            ./build-appimage.sh
          else
            # Standard build for Windows/macOS
            wails build -platform ${{ matrix.platform }} -ldflags="${VERSION_LD}"
          fi
          
          echo "Compilación completada exitosamente"
          
          # Generate checksums
          cd build/bin
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            sha256sum *.zip > checksums.txt 2>/dev/null || true
          else
            sha256sum * > checksums.txt 2>/dev/null || true
          fi
          cd ../../
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "Procesando archivo .app para macOS..."
            cd build/bin
            # En macOS el build genera una carpeta .app, comprimirla
            # El .zip es suficiente para distribución, los usuarios pueden descomprimirlo
            zip -r manga-visor2-macos.zip *.app
            echo "Archivo .zip creado correctamente"
          fi

      - name: Listar archivos en build/bin (debug)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "Contenido de build/bin:"
          ls -la build/bin/
          echo "Buscando .app:"
          find build/bin -maxdepth 1 -name "*.app" -type d

      - name: Subir archivos al Release
        shell: bash
        run: |
          RELEASE_TAG="${{ needs.create-release.outputs.release_tag }}"
          echo "Subiendo archivos al release: $RELEASE_TAG"
          
          # Subir checksums
          if [ -f "build/bin/checksums.txt" ]; then
            gh release upload "$RELEASE_TAG" build/bin/checksums.txt --clobber
          fi
          
          # Subir archivos según la plataforma
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Para macOS, solo subir el .zip (el .app está dentro)
            gh release upload "$RELEASE_TAG" build/bin/*.zip --clobber
          else
            # Para otras plataformas, subir todos los archivos
            gh release upload "$RELEASE_TAG" build/bin/* --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


